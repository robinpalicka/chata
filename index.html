<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chata – 3D model</title>
<style>
  :root {
    --ink: #1d2327; --ink-soft: #55616a; --panel: rgba(255, 255, 255, .82); --line: rgba(29, 35, 39, .12);
    --accent: #2f6b52; --accent-ink: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ea; color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.grabbing { cursor: grabbing; }
  #scene.pointing { cursor: pointer; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 30px rgba(20, 40, 50, .14); }

  #floors { left: 16px; top: 16px; padding: 12px; width: 212px; }
  #floors h1 { margin: 2px 6px 10px; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  #floors button { display: flex; align-items: baseline; gap: 8px; width: 100%; margin: 0 0 4px; padding: 9px 10px; text-align: left;
    font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
  #floors button:last-child { margin-bottom: 0; }
  #floors button:hover, #floors button.hover { background: rgba(47, 107, 82, .10); }
  #floors button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #floors button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  #floors .lvl { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .65; min-width: 40px; }
  #floors .name { font-weight: 600; }
  #floors hr { border: 0; border-top: 1px solid var(--line); margin: 8px 4px; }

  #caption { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 10px 16px; max-width: min(560px, calc(100vw - 32px));
    text-align: center; transition: opacity .25s; }
  #caption b { font-weight: 650; }
  #caption span { color: var(--ink-soft); }

  #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    background: #cfe0ea; color: var(--ink-soft); transition: opacity .4s; }
  #status.done { opacity: 0; pointer-events: none; }
  #status p { max-width: 460px; margin: 0; }
  #status code { background: rgba(0, 0, 0, .07); padding: 1px 5px; border-radius: 4px; }

  @media (max-width: 640px) {
    #floors { left: 8px; right: 8px; top: 8px; width: auto; padding: 8px; display: flex; gap: 4px; }
    #floors h1, #floors hr, #floors .lvl { display: none; }
    #floors button { margin: 0; justify-content: center; padding: 9px 4px; }
    #caption { left: 8px; right: 8px; bottom: 10px; transform: none; max-width: none; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { #status, #caption { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D model chaty"></canvas>

<nav id="floors" class="panel" aria-label="Patra">
  <h1>Chata</h1>
  <button type="button" data-floor="podkrovi" aria-pressed="false"><span class="lvl">2. NP</span><span class="name">Podkroví</span></button>
  <button type="button" data-floor="prizemi" aria-pressed="false"><span class="lvl">1. NP</span><span class="name">Přízemí</span></button>
  <button type="button" data-floor="sklep" aria-pressed="false"><span class="lvl">−1. PP</span><span class="name">Sklep</span></button>
  <hr>
  <button type="button" data-floor="" aria-pressed="true"><span class="lvl"></span><span class="name">Celý dům</span></button>
</nav>

<div id="caption" class="panel" role="status" aria-live="polite"></div>

<div id="status"><p>Načítám model…</p></div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
<script>
  // Opened straight from disk the browser blocks module scripts and the model download.
  if (location.protocol === 'file:') {
    document.querySelector('#status p').innerHTML =
      'Stránku je potřeba otevřít přes webový server, ne přímo ze souboru.<br>Ve složce s aplikací spusť <code>python -m http.server 8123</code> a otevři <code>http://localhost:8123</code>.';
  }
</script>
</body>
</html>
